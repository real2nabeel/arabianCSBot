# GPU X server with no monitor attached (HDMI-A-1 forced "on" through sysfs). Used to render CS clips.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "DontVTSwitch" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Device"
    Identifier "intel"
    Driver "modesetting"
    BusID "PCI:0:2:0"
    Option "AccelMethod" "glamor"
    Option "Monitor-HDMI-1" "virtual"
EndSection
Section "Monitor"
    Identifier "virtual"
    Modeline "1920x1080_60" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option "PreferredMode" "1920x1080_60"
EndSection
Section "Screen"
    Identifier "screen"
    Device "intel"
    Monitor "virtual"
    DefaultDepth 24
    SubSection "Display"
        Modes "1920x1080_60"
    EndSubSection
EndSection
